name: CI

on:
  pull_request:
  push:
    branches: [main]

# Nové pushnutí do stejné větve zruší předchozí běh — na PR se stejně počítá
# jen ten poslední a zbytečné běhy jen blokují frontu.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Pozor: `RUSTFLAGS: -D warnings` tu záměrně **není**. Dopadalo by i na
  # závislosti, takže by build shodilo varování z cizího kódu, se kterým se
  # nedá nic dělat. Přísnost se vynucuje explicitně přes `cargo clippy`.

jobs:
  # Knihovní crate: doména, aplikační vrstva, infrastruktura. Nepotřebují
  # žádné systémové knihovny, takže je tahle úloha rychlá a dá zpětnou vazbu
  # dřív než zbytek.
  rust:
    name: Rust — testy, formát, clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Verzi bere z rust-toolchain.toml, aby CI a lokální stroj hlásily totéž.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.0"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # Formátování se kontroluje pro celý workspace včetně src-tauri —
      # na to systémové knihovny potřeba nejsou.
      - name: Formát
        run: cargo fmt --all --check

      - name: Clippy
        run: |
          cargo clippy --all-targets \
            -p anvil-domain -p anvil-application -p anvil-infrastructure \
            -- -D warnings

      # Bez feature `engine`, takže se nestaví llama.cpp. Pokrývá doménu,
      # aplikační vrstvu i logiku infrastruktury — tedy všechno, co má testy.
      - name: Testy
        run: cargo test -p anvil-domain -p anvil-application -p anvil-infrastructure

  engine:
    name: Engine (llama.cpp) se přeloží
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.0"
      - uses: Swatinem/rust-cache@v2

      # Jen `check`, ne `test`: samotný engine nemá jednotkové testy (ověřuje
      # se proti reálnému modelu přes `examples/smoke`, což na CI nejde).
      # Smysl téhle úlohy je chytit, že se kód rozešel s API llama-cpp-2 —
      # bez ní by se to zjistilo až při lokálním buildu.
      # `--examples` je tam schválně: bez něj se `smoke` ani `review` nepřeloží,
      # protože `cargo check` příklady sám nestaví. Rozbitý harness pak projde
      # CI a zjistí se to až při ručním spuštění proti modelu — což už jednou
      # bylo, kvůli obyčejné uvozovce uvnitř řetězce.
      - name: cargo check --features engine
        run: cargo check -p anvil-infrastructure --features engine --examples --lib

  frontend:
    name: Frontend — typy a build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Verzi si vezme z pole `packageManager` v package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `pnpm build` je `tsc --noEmit && vite build` — typová kontrola
      # i skutečné sestavení.
      - run: pnpm build

  # Tauri crate zvlášť, protože jako jediný potřebuje webkit a GTK. Clippy nad
  # ním běží tady a ne v úloze `rust`, aby si rychlá úloha nemusela instalovat
  # sto megabajtů systémových balíčků.
  tauri:
    name: Tauri shell se přeloží
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Systémové závislosti
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libgtk-3-dev

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.0"
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # `tauri-build` v build.rs potřebuje existující `dist/`, jinak spadne
      # na chybějícím frontendu.
      - run: pnpm build

      - name: Clippy (Tauri crate)
        run: cargo clippy -p anvil --all-targets -- -D warnings

      # Testy `anvil` běží tady, protože rychlá úloha `rust` tenhle crate
      # vynechává (potřeboval by webkit a GTK). Bez toho by se nepustily nikde.
      - name: Testy (Tauri crate)
        run: cargo test -p anvil
