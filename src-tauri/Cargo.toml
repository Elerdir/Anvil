[package]
name = "anvil"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Anvil — lokální AI asistent na programování."

[lib]
# Tauri 2 očekává knihovnu vedle binárky (kvůli mobilním cílům a testům).
name = "anvil_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true }

[features]
default = []
# Přeposílají se do infrastruktury — bez nich se appka spustí, ale model
# nenačte a řekne proč.
engine = ["anvil-infrastructure/engine"]
engine-vulkan = ["anvil-infrastructure/engine-vulkan"]
engine-metal = ["anvil-infrastructure/engine-metal"]

[dependencies]
anvil-domain = { workspace = true }
anvil-application = { workspace = true }
anvil-infrastructure = { workspace = true }

tauri = { workspace = true }
tauri-plugin-dialog = { workspace = true }
tauri-plugin-opener = { workspace = true }

tokio = { workspace = true }
tokio-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
time = { workspace = true }
