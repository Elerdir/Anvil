[package]
name = "anvil"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Anvil — lokální AI asistent na programování."

[lib]
# Tauri 2 očekává knihovnu vedle binárky (kvůli mobilním cílům a testům).
name = "anvil_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true }

[features]
default = []

# Bez enginu se appka spustí, ale model nenačte a řekne proč.
#
# `engine-vulkan` a `engine-metal` musí zapnout i **místní** `engine`, ne jen
# ten v infrastruktuře. Cargo features se přes hranici crate nepropagují zpět:
# `anvil-infrastructure/engine-vulkan` zapne `engine` v infrastruktuře, ale
# `cfg!(feature = "engine")` v tomhle crate by zůstalo `false`. Aplikace by se
# pak přeložila i s llama.cpp, ale kompilovala by záslepku místo načítání
# modelu — a tvrdila by uživateli, že je build bez enginu.
engine = ["anvil-infrastructure/engine"]
engine-vulkan = ["engine", "anvil-infrastructure/engine-vulkan"]
engine-metal = ["engine", "anvil-infrastructure/engine-metal"]

[dependencies]
anvil-domain = { workspace = true }
anvil-application = { workspace = true }
anvil-infrastructure = { workspace = true }

tauri = { workspace = true }
tauri-plugin-dialog = { workspace = true }
tauri-plugin-opener = { workspace = true }

tokio = { workspace = true }
tokio-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
time = { workspace = true }
